name: admin_web
description: EduLearn admin website — classes & codes, teachers, rosters, requests, school reports.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Shared EduLearn packages
  edulearn_core:
    path: ../../packages/edulearn_core
  edulearn_ui:
    path: ../../packages/edulearn_ui

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.5.0
  cloud_functions: ^6.0.2
  firebase_storage: ^13.2.0

  # State, navigation, utilities
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0
  file_picker: ^10.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
