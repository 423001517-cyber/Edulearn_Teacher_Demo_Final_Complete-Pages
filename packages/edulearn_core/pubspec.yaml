name: edulearn_core
description: Shared EduLearn models, dates, report math and PDF/CSV export.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.2.0
  intl: ^0.20.2
  pdf: ^3.11.3
  # Used by `pdf`. image 4.11.x needs archive 4.4+, but pdf 3.12 only allows
  # archive below 4.1, so pub can pick a pair that doesn't compile
  # ("The method 'decodeLazy' isn't defined"). Stay below 4.11.
  image: ">=4.1.0 <4.11.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
